<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e5">
  <title>Coxi Recipe Calculator Inventory</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <h1 class="app-name">Coxi Recipe Calculator Inventory</h1>

    <div class="title-row">
      <img class="app-logo" src="../icons/icon.svg" alt="" width="40" height="40">
      <input id="inventory-name" class="event-name" type="text" placeholder="Inventory name" aria-label="Inventory name">
    </div>

    <div class="inventory-actions">
      <a class="button-link" href="../">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="../icons/sprite.svg#back"/></svg>
        Back to plan
      </a>
      <label class="button-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="../icons/sprite.svg#upload"/></svg>
        Load inventory file
        <input id="inventory-file" class="visually-hidden" type="file" accept=".json,application/json">
      </label>
      <button id="export-json" type="button" class="button-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="../icons/sprite.svg#download"/></svg>
        Export inventory as JSON
      </button>
      <button id="export-pdf" type="button" class="button-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="../icons/sprite.svg#download"/></svg>
        Export inventory as PDF
      </button>
    </div>

    <input id="inventory-search" class="row-recipe inventory-search" type="search" placeholder="Search ingredient…" aria-label="Search ingredient" autocomplete="off">

    <ul id="notices" class="notices"></ul>

    <!-- Ingredients grouped by category. Filled by js/pages/inventory.js. -->
    <div id="inventory-list"></div>
  </main>

  <script src="../vendor/pdfmake/pdfmake.min.js"></script>
  <script src="../vendor/pdfmake/vfs_fonts.js"></script>
  <script type="module" src="../js/pwa.js"></script>
  <script type="module" src="../js/pages/inventory.js"></script>
</body>
</html>
