<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f1e5">
  <title>Coxi Recipe Calculator Ingredients</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <main class="page">
    <h1 class="app-name">Coxi Recipe Calculator Ingredients</h1>

    <!-- List of all ingredients. Shown by default. -->
    <div id="list-view">
      <div class="title-row">
        <img class="app-logo" src="../icons/icon.svg" alt="" width="40" height="40">
        <h2 class="page-title">Ingredients</h2>
      </div>

      <div class="inventory-actions">
        <a class="button-link" href="../">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
          Back to plan
        </a>
        <button id="new-ingredient" type="button" class="button-link">+ New ingredient</button>
        <label class="button-link">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0-4 4m4-4 4 4M5 20h14"/></svg>
          Import ingredients file
          <input id="ingredient-file" class="visually-hidden" type="file" accept=".json,application/json">
        </label>
        <button id="export-ingredients" type="button" class="button-link">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg>
          Export ingredients file
        </button>
        <!-- Placeholder: replace "#" with the GitHub link to the user guide in docs/ once it exists. -->
        <a id="help-link" class="button-link" href="#">? Help</a>
      </div>

      <input id="ingredient-search" class="row-recipe inventory-search" type="search" placeholder="Search ingredient…" aria-label="Search ingredient" autocomplete="off">

      <ul id="notices" class="notices"></ul>

      <!-- Ingredients grouped by category. Filled by js/pages/ingredients.js. -->
      <div id="ingredient-list"></div>
    </div>

    <!-- Editor for one ingredient. Hidden until an ingredient is opened or created. -->
    <div id="editor-view" hidden>
      <div class="title-row">
        <img class="app-logo" src="../icons/icon.svg" alt="" width="40" height="40">
        <input id="ingredient-name" class="event-name recipe-name" type="text" placeholder="Ingredient name" aria-label="Ingredient name">
      </div>

      <div class="inventory-actions">
        <button id="editor-back" type="button" class="button-link">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg>
          Back to ingredients
        </button>
      </div>

      <div class="recipe-fields">
        <label class="field">
          <span>Unit</span>
          <input id="ingredient-unit" type="text" list="unit-options" autocomplete="off">
        </label>
        <label class="field">
          <span>Category</span>
          <input id="ingredient-category" type="text" list="category-options" autocomplete="off">
        </label>
        <label class="field">
          <span>Package size (in unit)</span>
          <input id="ingredient-package-size" type="number" min="0" step="any">
        </label>
        <label class="field">
          <span>Package price (€)</span>
          <input id="ingredient-package-price" type="number" min="0" step="0.01">
        </label>
        <label class="field">
          <span>Shop</span>
          <input id="ingredient-shop" type="text" list="shop-options" autocomplete="off">
        </label>
      </div>

      <!-- Shown as soon as the unit differs from the saved unit. -->
      <div id="unit-change" class="unit-change" hidden>
        <p class="unit-conversion">
          <input id="unit-old-amount" type="number" min="0" step="any" value="1" aria-label="Amount in the old unit">
          <span id="unit-old"></span> =
          <input id="unit-new-amount" type="number" min="0" step="any" value="1" aria-label="Amount in the new unit">
          <span id="unit-new"></span>
        </p>
        <p id="unit-affected" class="muted"></p>
      </div>

      <ul id="editor-errors" class="notices"></ul>

      <button id="save-ingredient" type="button" class="calculate">Save in this browser</button>

      <div class="downloads">
        <button id="discard-ingredient" type="button" class="button-link" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
          <span id="discard-label"></span>
        </button>
      </div>
    </div>
  </main>

  <!-- Suggestions for the form fields. Filled by js/ui/ingredient-editor.js. -->
  <datalist id="unit-options"></datalist>
  <datalist id="category-options"></datalist>
  <datalist id="shop-options"></datalist>

  <!-- Unit conversion on import. Filled and shown by js/ui/ingredient-editor.js. -->
  <dialog id="unit-dialog" class="share-dialog" aria-labelledby="unit-dialog-title">
    <h2 id="unit-dialog-title">Convert units</h2>
    <p class="muted">The file uses other units for some ingredients. Convert the amounts to the new unit, or cancel the import.</p>
    <div id="unit-dialog-body"></div>
    <ul id="unit-dialog-errors" class="notices"></ul>
    <div class="share-actions dialog-actions">
      <button id="unit-dialog-apply" type="button" class="button-link">Convert and import</button>
      <button id="unit-dialog-cancel" type="button" class="button-link">Cancel import</button>
    </div>
  </dialog>

  <script src="../vendor/pdfmake/pdfmake.min.js"></script>
  <script src="../vendor/pdfmake/vfs_fonts.js"></script>
  <script type="module" src="../js/pwa.js"></script>
  <script type="module" src="../js/pages/ingredients.js"></script>
</body>
</html>
